name: macos

on:
  push:
    branches: [mac]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: lint, types, tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen --dev

      - name: ruff check
        run: uv run --frozen ruff check .

      - name: ruff format (changed files only)
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [[ -z "${base}" || "${base}" == "0000000000000000000000000000000000000000" ]]; then
            echo "no base commit; skipping format gate"
            exit 0
          fi
          files="$(git diff --name-only --diff-filter=ACMR "${base}" HEAD -- '*.py')"
          if [[ -z "${files}" ]]; then
            echo "no python files changed"
            exit 0
          fi
          echo "${files}"
          echo "${files}" | tr '\n' '\0' | xargs -0 uv run --frozen ruff format --check

      - name: mypy
        run: uv run --frozen python -m mypy

      - name: pytest
        run: uv run --frozen python -m pytest -q

  linux-parity:
    name: linux engine parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen --dev

      - name: Tests must pass without any Apple engine
        run: uv run --frozen python -m pytest -q

      - name: Types must check on Linux too
        run: uv run --frozen python -m mypy

      - name: The GNOME paths must not have moved
        run: |
          set -euo pipefail
          uv run --frozen python - <<'PY'
          import os
          from pathlib import Path

          os.environ["XDG_CONFIG_HOME"] = "/tmp/cfg"
          os.environ["XDG_DATA_HOME"] = "/tmp/data"
          from desktop_app.platform import paths

          assert paths.config_dir() == Path("/tmp/cfg/translator"), paths.config_dir()
          assert paths.data_dir() == Path("/tmp/data/translator"), paths.data_dir()
          assert not paths.is_macos()
          from translate_logic.infrastructure.providers import apple

          assert not apple.is_available(), "apple engines must stay off on Linux"
          print("linux paths and engine gating OK")
          PY

  sidecar:
    name: swift sidecar
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          set -euo pipefail
          swift --version
          sdk="$(xcrun --show-sdk-version)"
          echo "macOS SDK: ${sdk}"
          # TranslationSession(installedSource:target:) is macOS 26 only.
          if [[ "${sdk%%.*}" -lt 26 ]]; then
            echo "::error::macOS 26 SDK required, runner has ${sdk}"
            exit 1
          fi

      - name: Build apple-lang-helper
        working-directory: macos/AppleLangHelper
        run: swift build -c release

      - name: Run AppleLangHelperCore tests
        working-directory: macos/AppleLangHelper
        run: scripts/swift-test.sh

      - name: Smoke the sidecar protocol
        working-directory: macos/AppleLangHelper
        run: |
          set -euo pipefail
          printf '%s\n' \
            '{"id":"1","op":"ping"}' \
            '{"id":"2","op":"dictionaries"}' \
            '{"id":"3","op":"shutdown"}' \
            | ./.build/release/apple-lang-helper | tee /tmp/sidecar.jsonl
          python3 - <<'PY'
          import json, pathlib, sys
          lines = [json.loads(l) for l in pathlib.Path("/tmp/sidecar.jsonl").read_text().splitlines() if l.strip()]
          assert [m["id"] for m in lines] == ["1", "2", "3"], lines
          assert all(m["ok"] for m in lines), lines
          assert lines[0]["result"]["pong"] is True
          print("sidecar protocol OK")
          PY

      - name: Upload sidecar
        uses: actions/upload-artifact@v4
        with:
          name: apple-lang-helper
          path: macos/AppleLangHelper/.build/release/apple-lang-helper
          if-no-files-found: error

  shell:
    name: swiftui shell
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Build Translator
        working-directory: macos/Translator
        run: swift build -c release

      - name: Run TranslatorCore tests
        working-directory: macos/Translator
        run: scripts/swift-test.sh

      - name: The shell must speak the Python protocol
        run: |
          set -euo pipefail
          # Method and event names are duplicated in Swift; drift breaks the app
          # silently, so compare both lists.
          python3 - <<'PY'
          import pathlib, re

          py = pathlib.Path("desktop_app/platform/macos/ipc/protocol.py").read_text()
          swift = pathlib.Path("macos/Translator/Sources/TranslatorCore/Protocol.swift").read_text()

          def literals(block: str, source: str) -> set[str]:
              body = re.search(rf"class {block}\(StrEnum\):(.*?)\n\n\n", source, re.S)
              assert body, block
              return set(re.findall(r'= "([^"]+)"', body.group(1)))

          methods = literals("Method", py)
          events = literals("Event", py)
          missing = sorted(n for n in methods | events if f'"{n}"' not in swift)
          assert not missing, f"swift shell is missing: {missing}"
          print(f"protocol parity OK: {len(methods)} methods, {len(events)} events")
          PY

  bundle:
    name: app bundle
    needs: [gate, sidecar, shell, linux-parity]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install CPython 3.13 for the bundle
        run: uv python install 3.13

      - name: Sync dependencies
        run: uv sync --frozen --dev

      - name: Build Translator.app
        run: scripts/build_macos_app.sh --out dist

      - name: Verify bundle contract
        run: |
          set -euo pipefail
          app="dist/Translator.app"
          test -x "${app}/Contents/MacOS/Translator"
          # A real SwiftUI binary, not the placeholder launcher.
          file "${app}/Contents/MacOS/Translator" | grep -q "Mach-O"
          test -x "${app}/Contents/Resources/bin/run-backend"
          test -x "${app}/Contents/Resources/bin/apple-lang-helper"
          test -x "${app}/Contents/Resources/python/bin/python3.13"
          test -d "${app}/Contents/Resources/app/desktop_app"
          test -d "${app}/Contents/Resources/app/translate_logic"
          # Offline bases are downloaded at first run; they must never ship.
          if find "${app}" -name '*.sqlite3' | grep -q .; then
            echo "offline databases leaked into the bundle"; exit 1
          fi
          codesign -v --deep --strict "${app}"
          du -sh "${app}"

      - name: Backend smoke from inside the bundle
        run: |
          set -euo pipefail
          export TRANSLATOR_CONFIG_DIR="${RUNNER_TEMP}/tr/cfg"
          export TRANSLATOR_DB_DIR="${RUNNER_TEMP}/tr/db"
          export TRANSLATOR_RUNTIME_DIR="/tmp/tr-run"
          export TRANSLATOR_LOG_DIR="${RUNNER_TEMP}/tr/logs"
          mkdir -p "${TRANSLATOR_DB_DIR}" "${TRANSLATOR_RUNTIME_DIR}"
          dist/Translator.app/Contents/Resources/bin/run-backend --log-level INFO &
          backend_pid=$!
          for _ in $(seq 1 30); do
            [[ -S "${TRANSLATOR_RUNTIME_DIR}/backend.sock" ]] && break
            sleep 1
          done
          test -S "${TRANSLATOR_RUNTIME_DIR}/backend.sock"
          # No offline bases on the runner: ping must still answer and report them missing.
          uv run --frozen python -m desktop_app.platform.macos.client ping --timeout 10 > ping.json
          python3 - <<'PY'
          import json
          data = json.load(open("ping.json"))["result"]
          assert data["protocol"] == 1, data
          assert data["db"] == {"primary": False, "fallback": False, "definitions": False, "dir": data["db"]["dir"]}, data["db"]
          print("bundle backend OK:", data["version"])
          PY
          uv run --frozen python -m desktop_app.platform.macos.client shutdown --timeout 10 || true
          wait "${backend_pid}" 2>/dev/null || true

      - name: Package bundle
        run: |
          set -euo pipefail
          mkdir -p out
          ditto -c -k --sequesterRsrc --keepParent dist/Translator.app out/Translator-macos.zip
          cp scripts/install_macos.sh out/
          shasum -a 256 out/Translator-macos.zip out/install_macos.sh \
            | sed 's| out/|  |' > out/macos-assets.sha256
          cat out/macos-assets.sha256

      - name: Installer must verify what the release ships
        run: |
          set -euo pipefail
          # The installer resolves the app from dist/ by default and from
          # TRANSLATOR_APP_PATH otherwise; both must exist for a tag build.
          grep -q 'TRANSLATOR_APP_PATH' scripts/install_macos.sh
          bash -n out/install_macos.sh
          uv run --frozen python - <<'PY'
          import pathlib

          expected = {"Translator-macos.zip", "install_macos.sh"}
          from dev.scripts.release_metadata import OPTIONAL_CODE_ASSET_FILES

          assert set(OPTIONAL_CODE_ASSET_FILES) == expected, OPTIONAL_CODE_ASSET_FILES
          names = {line.split("  ")[-1].strip()
                   for line in pathlib.Path("out/macos-assets.sha256").read_text().splitlines()
                   if line.strip()}
          assert names == expected, names
          print("release asset names match the manifest contract")
          PY

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: Translator-macos
          path: |
            out/Translator-macos.zip
            out/install_macos.sh
            out/macos-assets.sha256
          if-no-files-found: error

  notarize:
    name: notarize
    needs: [bundle]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Download bundle
        uses: actions/download-artifact@v4
        with:
          name: Translator-macos
          path: out

      - name: Check notarization secrets
        id: secrets
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [[ -n "${APPLE_ID}" && -n "${APPLE_TEAM_ID}" && -n "${APPLE_APP_PASSWORD}" && -n "${APPLE_SIGNING_IDENTITY}" ]]; then
            echo "ready=true" >> "${GITHUB_OUTPUT}"
          else
            echo "ready=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Developer ID secrets absent; skipping notarization."
          fi

      - name: Import signing certificate
        if: steps.secrets.outputs.ready == 'true'
        env:
          CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="${RUNNER_TEMP}/build.keychain"
          security create-keychain -p actions "${keychain}"
          security set-keychain-settings -lut 3600 "${keychain}"
          security unlock-keychain -p actions "${keychain}"
          echo "${CERT_BASE64}" | base64 --decode > "${RUNNER_TEMP}/cert.p12"
          security import "${RUNNER_TEMP}/cert.p12" -k "${keychain}" -P "${CERT_PASSWORD}" \
            -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "${keychain}" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions "${keychain}"
          rm -f "${RUNNER_TEMP}/cert.p12"

      - name: Sign, notarize and staple
        if: steps.secrets.outputs.ready == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          ditto -x -k out/Translator-macos.zip unpacked
          app="unpacked/Translator.app"
          find "${app}/Contents/Resources" -type f \( -name '*.so' -o -name '*.dylib' \) \
            -exec codesign --force --timestamp --options runtime --sign "${APPLE_SIGNING_IDENTITY}" {} +
          codesign --force --timestamp --options runtime --sign "${APPLE_SIGNING_IDENTITY}" \
            "${app}/Contents/Resources/python/bin/python3.13" \
            "${app}/Contents/Resources/bin/apple-lang-helper"
          codesign --force --timestamp --options runtime --sign "${APPLE_SIGNING_IDENTITY}" "${app}"
          ditto -c -k --sequesterRsrc --keepParent "${app}" notarize.zip
          xcrun notarytool submit notarize.zip --apple-id "${APPLE_ID}" \
            --team-id "${APPLE_TEAM_ID}" --password "${APPLE_APP_PASSWORD}" --wait
          xcrun stapler staple "${app}"
          spctl -a -vvv "${app}"
          mkdir -p signed
          ditto -c -k --sequesterRsrc --keepParent "${app}" signed/Translator-macos.zip

      - name: Upload notarized bundle
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Translator-macos-notarized
          path: signed/Translator-macos.zip
          if-no-files-found: error
